[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ecommerce-support-agent"
version = "0.1.0"
description = "E-commerce customer support agent built with LangGraph and Ollama"
readme = "README.md"
packages = [
    { include = "src" },
    { include = "eval" },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langgraph = ">=0.4,<1"
langchain-ollama = ">=0.3,<1"
langchain-core = ">=0.3,<1"

[tool.poetry.scripts]
chat = "main:main"
seed-db = "src.data.seed:main"
run-eval = "eval.run_eval:main"
